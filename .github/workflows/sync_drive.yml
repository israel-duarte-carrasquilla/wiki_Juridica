name: Sincronización Automática con Google Drive

on:
  schedule:
    # Ejecutar todos los días a las 00:00 y 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Sincronización de Drive
        run: |
          python sync_drive.py

      - name: Confirmar y subir cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Sync"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Sincronizacion automatica programada de Google Drive [skip ci]" && git push)
